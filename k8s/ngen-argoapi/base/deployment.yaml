apiVersion: apps/v1
kind: Deployment
metadata:
  name: argoapi
  labels:
    app: argoapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argoapi
  template:
    metadata:
      labels:
        app: argoapi
    spec:
      containers:
        - name: argoapi
          image: python:3.11-slim
          ports:
            - containerPort: 8899
              protocol: TCP
          command:
            - /bin/bash
            - -c
            - |
              if [ "$ARGOAPI_VERSION" = "latest" ] || [ -z "$ARGOAPI_VERSION" ]; then
                pip install --upgrade ngen-argoapi
              else
                pip install ngen-argoapi==$ARGOAPI_VERSION
              fi && \
              argoapi login --url $ARGOCD_URL --user $ARGOCD_USER --password $ARGOCD_PASSWORD && \
              argoapi server
          env:
            - name: ARGOAPI_VERSION
              value: "latest"
            - name: ARGOCD_URL
              value: "https://argocd.example.com"
            - name: ARGOCD_USER
              value: "admin"
            - name: ARGOCD_PASSWORD
              value: "password"
          # Health check probes using /health endpoint
          livenessProbe:
            httpGet:
              path: /health
              port: 8899
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8899
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8899
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

