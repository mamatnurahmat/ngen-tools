---
# CronJob untuk argocd-develop-qoin-argoapi
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redeploy-argocd-develop-qoin-argoapi
  namespace: default
spec:
  schedule: "0 */12 * * *"  # Setiap menit
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: redeploy-sa
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - kubectl rollout restart deployment/argocd-develop-qoin-argoapi -n default
          restartPolicy: OnFailure
---
