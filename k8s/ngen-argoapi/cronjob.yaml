---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redeploy-sa
  namespace: default
---
# ClusterRole dengan akses ke semua namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redeploy-clusterrole
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redeploy-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redeploy-clusterrole
subjects:
- kind: ServiceAccount
  name: redeploy-sa
  namespace: default